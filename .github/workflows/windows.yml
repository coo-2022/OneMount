name: Windows preview build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-src/rclone/go.mod
          cache-dependency-path: engine-src/rclone/go.sum
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify custom backend discovery and Go tests
        run: npm run engine:rclone:test
      - name: Build custom rclone and download verified JuiceFS
        run: npm run engines:win
      - name: Validate commands with real Windows engines
        run: node scripts/check-windows-engines.cjs
      - name: Install verified WinFsp on test runner
        run: ./scripts/install-ci-winfsp.ps1
      - name: Exercise real Windows filesystem mounts
        timeout-minutes: 8
        run: node scripts/windows-mount-integration.cjs
      - name: Build portable Windows application
        run: npm run package:win
      - name: Install isolated desktop test tools
        run: |
          npm install --prefix "$env:RUNNER_TEMP/onemount-tools" --no-audit --no-fund playwright@1.64.0
          "ONEMOUNT_PLAYWRIGHT=$env:RUNNER_TEMP/onemount-tools/node_modules/playwright" >> $env:GITHUB_ENV
      - name: Validate packaged desktop application
        timeout-minutes: 6
        run: node scripts/windows-packaged-e2e.cjs
      - name: Verify both mount modes as a standard Windows user
        timeout-minutes: 12
        run: ./scripts/run-standard-user-test.ps1 -Script scripts/windows-mount-integration.cjs
      - name: Validate packaged desktop app as a standard Windows user
        timeout-minutes: 12
        run: ./scripts/run-standard-user-test.ps1 -Script scripts/windows-packaged-e2e.cjs
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation-evidence
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: OneMount-Windows-x64-preview
          path: dist/CloudIsland-win32-x64/
          retention-days: 14
