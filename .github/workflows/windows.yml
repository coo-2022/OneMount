name: Windows preview build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-src/rclone/go.mod
          cache-dependency-path: engine-src/rclone/go.sum
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify custom backend discovery and Go tests
        run: npm run engine:rclone:test
      - name: Build custom rclone and download verified JuiceFS
        run: npm run engines:win
      - name: Validate commands with real Windows engines
        run: node scripts/check-windows-engines.cjs
      - name: Install verified WinFsp on test runner
        run: ./scripts/install-ci-winfsp.ps1
      - name: Exercise real Windows filesystem mounts
        timeout-minutes: 8
        run: node scripts/windows-mount-integration.cjs
      - name: Verify JuiceFS local disks and persistent cache transitions
        timeout-minutes: 5
        run: node scripts/windows-cache-settings-integration.cjs
      - name: Build portable Windows application
        run: npm run package:win
      - name: Build Windows installer and update metadata
        run: npm run installer:win
      - name: Verify installer contents and update checksums
        run: npm run installer:check
      - name: Install isolated desktop test tools
        run: |
          npm install --prefix "$env:RUNNER_TEMP/onemount-tools" --no-audit --no-fund playwright@1.64.0
          "ONEMOUNT_PLAYWRIGHT=$env:RUNNER_TEMP/onemount-tools/node_modules/playwright" >> $env:GITHUB_ENV
      - name: Validate packaged desktop application
        timeout-minutes: 6
        run: node scripts/windows-packaged-e2e.cjs
      - name: Verify provider editions and OneMount profile compatibility
        timeout-minutes: 3
        run: node scripts/windows-provider-config-smoke.cjs
      - name: Build isolated installer upgrade fixtures
        timeout-minutes: 8
        run: node scripts/build-install-test-fixtures.cjs
        env:
          ONEMOUNT_ELECTRON_DIST: node_modules/electron/dist
      - name: Verify installation, upgrade and safe uninstall
        timeout-minutes: 6
        run: node scripts/windows-install-update-smoke.cjs
      - name: Verify real updater downloads and checksum rejection
        timeout-minutes: 3
        run: node scripts/windows-update-download-smoke.cjs
      - name: Verify both mount modes as a standard Windows user
        timeout-minutes: 12
        run: ./scripts/run-standard-user-test.ps1 -Script scripts/windows-mount-integration.cjs
      - name: Validate packaged desktop app as a standard Windows user
        timeout-minutes: 12
        run: ./scripts/run-standard-user-test.ps1 -Script scripts/windows-packaged-e2e.cjs
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation-evidence
          path: |
            test-results/*report*.json
            test-results/onemount-provider-desktop.json
            test-results/*.png
            test-results/*.log
            test-results/cache-settings-*/report.json
            test-results/update-download-smoke/run-*/report.json
            test-results/update-download-smoke/run-*/requests.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: OneMount-Windows-x64-preview
          path: dist/OneMount-win32-x64/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: OneMount-Windows-x64-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.blockmap
            dist/installer/latest.yml
            dist/installer/BUILD-CHECK.json
          retention-days: 14
