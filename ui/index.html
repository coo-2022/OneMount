<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>云屿</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"></head>
<body><div id="island-refined"><div class="ir-shell">
<aside class="ir-side"><div class="ir-brand"><span class="ir-brandmark"><i data-lucide="cloud"></i></span>云屿<span class="beta">PREVIEW</span></div>
<nav class="ir-nav" aria-label="主导航"><button data-nav="home" aria-pressed="true"><i data-lucide="layout-grid"></i>我的磁盘</button><button data-nav="activity"><i data-lucide="arrow-up-down"></i>活动<span class="ir-badge" id="activity-badge"></span></button><button data-nav="connections"><i data-lucide="cloud"></i>存储连接</button><button data-nav="settings"><i data-lucide="settings-2"></i>设置</button></nav>
<div class="ir-shortcuts"><div class="ir-sidecaption">快速访问</div><div id="shortcuts"></div></div>
<div class="ir-sidefoot"><span class="ir-avatar"><i data-lucide="monitor"></i></span><div><strong>这台电脑</strong><small>本地管理，随时可用</small></div></div></aside>
<div class="ir-body"><header class="ir-topbar"><div class="ir-breadcrumb"><button data-nav="home">云屿</button><span id="crumb">/ 我的磁盘</span></div><div class="ir-tools"><button class="ir-traytoggle" data-nav="activity"><i data-lucide="cloud-upload"></i><span id="total-status">就绪</span></button></div></header>
<main class="ir-content" id="content"><div class="empty"><span class="spinner"></span><h1>正在准备你的空间</h1></div></main>
<footer class="ir-footer"><span id="foot-state">正在启动</span><span>云屿 0.1.1 · 本地预览版</span></footer></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ir-overlay" id="overlay" hidden><section class="ir-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-content"></div></section></div>
</div><script src="lucide.js"></script><script src="app.js"></script></body></html>
